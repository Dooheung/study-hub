<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 30px 20px;
  text-align: center;
  background: #1e293b;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #cbd5e1;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  margin-bottom: 25px;
}

h2 {
  margin-top: 25px;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.subject {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  font-size: 18px;
  cursor: pointer;
}

.subject:hover {
  background: #334155;
}

.quiz {
  margin-top: 30px;
  padding: 25px;
  background: #1e293b;
  border-radius: 15px;
}

button {
  background: #3b82f6;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

footer {
  text-align: center;
  padding: 30px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>📚 Study Hub</h1>
  <p>Học tập dễ dàng hơn mỗi ngày</p>
</header>

<div class="container">

  <input
    class="search"
    type="text"
    placeholder="🔎 Tìm kiếm môn học..."
    onkeyup="searchSubjects()"
    id="search"
  >

  <h2>📖 Môn học</h2>

  <div class="subjects" id="subjects">

    <div class="subject">
      📐<br>
      Toán
    </div>

    <div class="subject">
      📝<br>
      Ngữ Văn
    </div>

    <div class="subject">
      🇬🇧<br>
      Tiếng Anh
    </div>

    <div class="subject">
      🔬<br>
      Khoa học
    </div>

  </div>

  <div class="quiz">

    <h2>🎯 Quiz nhanh</h2>

    <p>2 + 2 bằng bao nhiêu?</p>

    <button onclick="checkAnswer(3)">3</button>
    <button onclick="checkAnswer(4)">4</button>
    <button onclick="checkAnswer(5)">5</button>

    <p id="result"></p>

  </div>

</div>

<footer>
  © 2026 Study Hub
</footer>

<script>

function checkAnswer(answer) {

  let result = document.getElementById("result");

  if (answer === 4) {
    result.innerHTML = "🎉 Chính xác!";
  } else {
    result.innerHTML = "❌ Chưa đúng, thử lại nhé!";
  }

}

function searchSubjects() {

  let search =
    document.getElementById("search").value.toLowerCase();

  let subjects =
    document.querySelectorAll(".subject");

  subjects.forEach(function(subject) {

    if (subject.innerText.toLowerCase().includes(search)) {
      subject.style.display = "block";
    } else {
      subject.style.display = "none";
    }

  });

}

</script>

</body>
</html>
